<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Todo List</title>
    <style>
      :root {
        font-size: clamp(0.2px, 100vw / 350, 1px);
        height: 100%;
        height: 100svh;

        -webkit-tap-highlight-color: transparent;
      }

      body {
        font: 14rem sans-serif;
        margin: 0;
        height: 100%;
      }

      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button,
      input,
      fieldset {
        border: 1px solid #88888866;
        border-radius: 4rem;
        border-style: solid;
        border-width: thin;
        padding: 4rem 8rem;
      }

      button,
      input {
        cursor: pointer;
        background: #f8f8f8;
        color: #000000dd;
      }

      button:hover,
      input:hover {
        filter: brightness(0.9);
      }

      button:focus {
        outline: none;
      }

      legend {
        /* Safari */
        width: fit-content;
        padding: 0 8rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
  <script type="module" src="index.tsx"></script>
</html>
